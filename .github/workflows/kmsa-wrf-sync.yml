name: KMSA WRF sync

# Copies new KMSA WRF runs from the NWP workstation to gs://sheerwater-datalake/kmsa-wrf,
# where kmsa-wrf-fetch reads them.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days
        default: "10"

concurrency:
  group: kmsa-wrf-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.KMSA_BUCKET_CREDENTIALS }}
      - run: uv run tools/kmsa_wrf_sync.py --days "${{ inputs.days || '10' }}"
        env:
          KMSA_SERVER: ${{ secrets.KMSA_SERVER }}
          KMSA_SECRET: ${{ secrets.KMSA_SECRET }}
